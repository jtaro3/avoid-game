<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>AI追跡 避けゲー</title>

<link rel="stylesheet" href="css/style.css">

</head>
<body>

<h1>AI追跡 避けゲー</h1>

<p id="score">
残り：50 秒 / スコア：1 / 最高：1 / 敵：0
</p>

<p class="controls">マウス・タッチ・矢印キー（WASD）で移動</p>

<button id="startBtn">開始</button>
<button id="ruleBtn">ルール</button>

<div id="game">

<div id="overlay" style="display:none;" aria-live="polite"></div>

<div id="ruleWindow">

<h2>ルール説明</h2>

<p>
🟩 緑アイテムを取ると<br>
・スコア +3<br>
・敵が1体増える
</p>

<p>
🟪 紫アイテムを取ると<br>
・スコア -5<br>
・敵が3秒間遅くなる
</p>

<p>
🔴 赤い敵に当たるとゲームオーバー
</p>

<p>
⏰ 制限時間は50秒
</p>

<button id="closeRule">閉じる</button>

</div>

<div id="player" class="player"></div>
<div id="item" class="item"></div>
<div id="slow" class="slow"></div>

</div>

<div id="version">v1.1.4</div>

<script src="js/script.js"></script>

</body>
</html>
